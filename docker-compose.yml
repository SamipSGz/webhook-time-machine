# Local dev mirror of the Zerops managed services. `docker compose up -d`, then
# copy .env.example -> .env and run the app + worker locally.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: webhook
      POSTGRES_PASSWORD: webhook
      POSTGRES_DB: webhook
    ports: ["5432:5432"]

  nats:
    image: nats:2.10
    command: ["-js"]           # enable JetStream
    ports: ["4222:4222"]

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports: ["8123:8123"]      # HTTP interface (clickhouse-connect); native 9000 left internal
    volumes:
      - ./deploy/clickhouse-open.xml:/etc/clickhouse-server/users.d/open-networks.xml:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }

  valkey:
    image: valkey/valkey:8
    ports: ["6379:6379"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
