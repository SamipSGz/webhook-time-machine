# Build + run config for the two Python app services (api, worker).
# Deps are installed in the RUN container via prepareCommands: Zerops build and
# run are separate containers, so packages pip-installed during build do not
# exist at runtime. deployFiles ships the code; prepareCommands installs deps.

zerops:
  # ============================================================ API (public)
  - setup: api
    build:
      base: python@3.12
      buildCommands:
        - echo "packaging application files"
      deployFiles: ./
    run:
      base: python@3.12
      prepareCommands:
        - python -m pip install --upgrade pip
        - python -m pip install -r requirements.txt
      ports:
        - port: 8000
          httpSupport: true
      envVariables: &appenv
        POSTGRES_DSN: ${db_connectionString}
        NATS_URL: ${nats_connectionString}
        REDIS_URL: ${valkey_connectionString}
        CLICKHOUSE_HOST: ${clickhouse_hostname}
        CLICKHOUSE_PORT: "8123"
        CLICKHOUSE_USER: zerops
        CLICKHOUSE_PASSWORD: ${clickhouse_password}
        CLICKHOUSE_DB: clickhouse
        S3_ENDPOINT: ${storage_apiUrl}
        S3_ACCESS_KEY: ${storage_accessKeyId}
        S3_SECRET_KEY: ${storage_secretAccessKey}
        S3_BUCKET: ${storage_bucketName}
        INTERNAL_BASE_URL: http://api:8000
        MAX_ATTEMPTS: "5"
        BASE_BACKOFF_SECONDS: "2"
      start: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'
      healthCheck:
        httpGet:
          port: 8000
          path: /healthz

  # ============================================================ Worker (private)
  - setup: worker
    build:
      base: python@3.12
      buildCommands:
        - echo "packaging application files"
      deployFiles: ./
    run:
      base: python@3.12
      prepareCommands:
        - python -m pip install --upgrade pip
        - python -m pip install -r requirements.txt
      envVariables: *appenv
      start: python -m app.worker
