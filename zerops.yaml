# Build + run config for the two Python app services (api, worker).
# Zerops build and run are SEPARATE containers, and pip-installed system packages
# do NOT carry over. So we build a self-contained virtualenv INSIDE the project
# dir during build (--copies makes it relocatable), and deployFiles ships it to
# the run container. The start command runs from that venv's python.

zerops:
  # ============================================================ API (public)
  - setup: api
    build:
      base: python@3.12
      buildCommands:
        - python3 -m venv --copies .venv
        - .venv/bin/pip install --upgrade pip
        - .venv/bin/pip install -r requirements.txt
      deployFiles: ./
    run:
      base: python@3.12
      ports:
        - port: 8000
          httpSupport: true
      envVariables: &appenv
        POSTGRES_DSN: ${db_connectionString}
        NATS_URL: ${nats_connectionString}
        REDIS_URL: ${valkey_connectionString}
        CLICKHOUSE_HOST: ${clickhouse_hostname}
        CLICKHOUSE_PORT: "8123"
        CLICKHOUSE_USER: zerops
        CLICKHOUSE_PASSWORD: ${clickhouse_password}
        CLICKHOUSE_DB: clickhouse
        S3_ENDPOINT: ${storage_apiUrl}
        S3_ACCESS_KEY: ${storage_accessKeyId}
        S3_SECRET_KEY: ${storage_secretAccessKey}
        S3_BUCKET: ${storage_bucketName}
        INTERNAL_BASE_URL: http://api:8000
        MAX_ATTEMPTS: "5"
        BASE_BACKOFF_SECONDS: "2"
      start: .venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'
      healthCheck:
        httpGet:
          port: 8000
          path: /healthz

  # ============================================================ Worker (private)
  - setup: worker
    build:
      base: python@3.12
      buildCommands:
        - python3 -m venv --copies .venv
        - .venv/bin/pip install --upgrade pip
        - .venv/bin/pip install -r requirements.txt
      deployFiles: ./
    run:
      base: python@3.12
      envVariables: *appenv
      start: .venv/bin/python -m app.worker
