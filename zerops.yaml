# Build + run config for the two Python app services (api, worker).
# Deploy with: `zcli push` (or wire the GitHub integration in the Zerops GUI).
#
# Env vars use Zerops' cross-service reference syntax ${servicehostname_var}.
# Managed services expose their own connection vars — verify exact names in the
# Zerops GUI (Service detail → "Environment variables") if a name differs here.

zerops:
  # ============================================================ API (public)
  - setup: api
    build:
      base: python@3.12
      buildCommands:
        - python -m pip install --upgrade pip
        - pip install -r requirements.txt
      deployFiles: ./
      cache:
        - ~/.cache/pip
    run:
      base: python@3.12
      ports:
        - port: 8000
          httpSupport: true
      envVariables: &appenv
        POSTGRES_DSN: ${db_connectionString}
        NATS_URL: ${nats_connectionString}
        REDIS_URL: ${valkey_connectionString}
        CLICKHOUSE_HOST: ${clickhouse_hostname}
        CLICKHOUSE_PORT: "8123"
        CLICKHOUSE_USER: zerops
        CLICKHOUSE_PASSWORD: ${clickhouse_password}
        CLICKHOUSE_DB: clickhouse
        S3_ENDPOINT: ${storage_apiUrl}
        S3_ACCESS_KEY: ${storage_accessKeyId}
        S3_SECRET_KEY: ${storage_secretAccessKey}
        S3_BUCKET: ${storage_bucketName}
        INTERNAL_BASE_URL: http://api:8000
        MAX_ATTEMPTS: "5"
        BASE_BACKOFF_SECONDS: "2"
      start: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'
      healthCheck:
        httpGet:
          port: 8000
          path: /

  # ============================================================ Worker (private)
  - setup: worker
    build:
      base: python@3.12
      buildCommands:
        - python -m pip install --upgrade pip
        - pip install -r requirements.txt
      deployFiles: ./
      cache:
        - ~/.cache/pip
    run:
      base: python@3.12
      envVariables: *appenv
      start: python -m app.worker
