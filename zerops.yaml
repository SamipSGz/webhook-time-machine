# Build + run config for the two Python app services (api, worker).
# Zerops build and run are SEPARATE containers. Pattern (per Zerops Python docs):
#   deployFiles      -> ships app code to the run container
#   addToRunPrepare  -> copies requirements.txt into the run-prepare container
#   run.prepareCommands -> pip installs there, so deps exist at runtime

zerops:
  # ============================================================ API (public)
  - setup: api
    build:
      base: python@3.12
      deployFiles: ./
      addToRunPrepare:
        - requirements.txt
    run:
      base: python@3.12
      prepareCommands:
        - python3 -m pip install --upgrade pip
        - python3 -m pip install --ignore-installed -r requirements.txt
      ports:
        - port: 8000
          httpSupport: true
      envVariables: &appenv
        POSTGRES_DSN: ${db_connectionString}
        NATS_URL: ${nats_connectionString}
        REDIS_URL: ${valkey_connectionString}
        CLICKHOUSE_HOST: ${clickhouse_hostname}
        CLICKHOUSE_PORT: "8123"
        CLICKHOUSE_USER: zerops
        CLICKHOUSE_PASSWORD: ${clickhouse_password}
        CLICKHOUSE_DB: clickhouse
        S3_ENDPOINT: ${storage_apiUrl}
        S3_ACCESS_KEY: ${storage_accessKeyId}
        S3_SECRET_KEY: ${storage_secretAccessKey}
        S3_BUCKET: ${storage_bucketName}
        INTERNAL_BASE_URL: http://api:8000
        MAX_ATTEMPTS: "5"
        BASE_BACKOFF_SECONDS: "2"
      start: python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'
      healthCheck:
        httpGet:
          port: 8000
          path: /healthz

  # ============================================================ Worker (private)
  - setup: worker
    build:
      base: python@3.12
      deployFiles: ./
      addToRunPrepare:
        - requirements.txt
    run:
      base: python@3.12
      prepareCommands:
        - python3 -m pip install --upgrade pip
        - python3 -m pip install --ignore-installed -r requirements.txt
      envVariables: *appenv
      start: python3 -m app.worker
